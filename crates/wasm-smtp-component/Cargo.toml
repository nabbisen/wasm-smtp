[package]
name = "wasm-smtp-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WASM Component Model interface for wasm-smtp (wasm32-wasip2 target)."
readme = "README.md"
keywords = ["smtp", "email", "wasm", "component-model", "wit"]
categories = ["email", "network-programming", "wasm"]

[lib]
# `cdylib` produces the `.wasm` binary consumed by Component Model runtimes.
# `rlib` allows the crate to be tested on native hosts.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["webpki-roots"]
webpki-roots  = ["wasm-smtp-wasi/webpki-roots"]
native-roots  = ["wasm-smtp-wasi/native-roots"]

[dependencies]
wasm-smtp      = { path = "../wasm-smtp",      version = "0.17.0", default-features = false }
wasm-smtp-wasi = { path = "../wasm-smtp-wasi", version = "0.17.0", default-features = false }

# wit-bindgen generates the WIT bindings at compile time via a proc macro.
# The generated Guest trait is implemented in src/lib.rs.
# Only needed on WASM targets; on native the bindings module is stubbed out.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.62", default-features = false, features = ["macros"] }
# The WASI imports of the `smtp-client` world are mapped onto this crate's
# bindings (see the `with:` block in src/lib.rs) so that wit-bindgen does not
# generate a second, unused copy of them. It is already in the wasm32
# dependency tree via wasm-smtp-wasi. 0.14 implements WASI 0.2.4, which is
# what wit/deps/ carries.
wasi = { version = "0.14", default-features = false }

[dev-dependencies]
wasm-smtp-test = { path = "../wasm-smtp-test" }

# This crate cannot use `[lints] workspace = true` unchanged. The workspace
# sets `unsafe_code = "forbid"`, and `forbid` cannot be lifted anywhere in the
# crate — not even for generated code. The Component Model export glue that
# `wit_bindgen::generate!` / `export!` emit is `unsafe` by construction: it is
# the canonical ABI lowering, with `#[export_name]` functions and raw pointer
# work. So the level is `deny` here instead, and exactly two generated-code
# modules in src/lib.rs carry `#[allow(unsafe_code)]`. Every hand-written line
# in this crate is still refused if it uses `unsafe`.
#
# See RFC 024 review 2 escalation E1; DEC-002 needs an explicit amendment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
