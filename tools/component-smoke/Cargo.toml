[package]
name = "wasm-smtp-component-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Executes the wasm-smtp Component Model export under a host (dev-only, never published)."
# Test tooling, not a library. Never goes to crates.io.
publish = false

[[bin]]
name = "wasm-smtp-component-smoke"
path = "src/main.rs"

[dependencies]
# The scripted SMTP responder, shared with the adapter-level smoke test.
wasm-smtp-smoke = { path = "../smoke" }
rustls-pki-types = { workspace = true, features = ["std"] }

# The host, pinned exactly so a bump is a visible decision.
#
# 36.0.14 is on wasmtime's LTS line, and the line is the point: at the
# time of writing every advisory RustSec has open against wasmtime and
# wasmtime-wasi — twenty of them, two rated critical — is fixed in
# 36.0.14, and the LTS line keeps receiving those backports. The first
# version tried here was 38.0.4, chosen for its MSRV, and `cargo audit`
# in the gate rejected it: 38.x is a release line nobody backports to.
# 36.0.14 builds on the 1.88.0 this workspace pins, needs no source
# change from 38, and clears the audit.
#
# The adapter smoke test's wasmtime CLI is on the same 36.0.x line since
# RFC 032 D4, pinned separately in .github/workflows/ci.yml: that one is a
# downloaded binary, this one is what the component is linked against, and
# a bump to either is a visible decision. `cargo audit` is what forces the
# next bump of this one; an exact pin does not rot silently behind it.
wasmtime = "=36.0.14"
wasmtime-wasi = "=36.0.14"

[lints]
workspace = true
