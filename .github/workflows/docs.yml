name: Docs

# Builds the mdBook under docs/ and publishes it to GitHub Pages.
#
# Deliberately separate from the release gate in ci.yml: a broken book
# should be visible on the Actions tab, not a reason a crate release
# cannot go out. The repository's Pages source must be set to
# "GitHub Actions" for the deploy step to succeed.

on:
  push:
    branches: [main]
  # Pull requests build the book so a broken one is seen before merge; they
  # never deploy (RFC 032 D2).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
# Pull-request builds get a group of their own per pull request, so a PR can
# cancel its own stale build but never a deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

env:
  # Pinned so the published book matches what contributors build locally.
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}

      - name: Build
        run: mdbook build docs

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/book

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
