name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Blocking gate. Runs the command list from RFC 024 §D3 verbatim on the
  # toolchain pinned by rust-toolchain.toml (channel, components, and the
  # wasm targets all come from that file).
  #
  # Cargo commands that resolve dependencies carry --locked, so CI tests
  # the committed Cargo.lock rather than one it resolved itself (RFC 032
  # D4). Third-party actions are pinned by commit SHA with the release in a
  # trailing comment, so a moved tag cannot change what the gate runs;
  # first-party actions/* stay on major tags. SHAs are bumped by hand, as a
  # visible commit (RFC 032, resolution 1).
  gate:
    name: gate (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # `rustup show active-toolchain` installs the channel, components,
        # and targets declared in rust-toolchain.toml.
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test (lib + integration + doctests)
        run: cargo test --locked --workspace

      # Feature combinations. Never --all-features: the tokio adapter has a
      # deliberate compile_error! on aws-lc-rs + ring (DEC-009), so the sets
      # are enumerated instead. The core's feature set is `test`, not `check`:
      # its smtputf8, mail-builder and tracing tests run nowhere else, and
      # `-p` keeps those features out of the workspace run (RFC 032 A6).
      - name: Check feature combinations
        run: |
          cargo check --locked -p wasm-smtp --no-default-features
          cargo test --locked -p wasm-smtp --features smtputf8,mail-builder,tracing
          cargo check --locked -p wasm-smtp-wasi --no-default-features --features native-roots
          cargo check --locked -p wasm-smtp-wasi --features plaintext-only
          cargo check --locked -p wasm-smtp-tokio --no-default-features --features webpki-roots,ring

      - name: Check real targets
        run: |
          cargo check --locked -p wasm-smtp -p wasm-smtp-cloudflare --target wasm32-unknown-unknown
          cargo check --locked -p wasm-smtp -p wasm-smtp-wasi -p wasm-smtp-component --target wasm32-wasip2

      # The component is useless to a consumer without its contract, and
      # cargo silently omits files the manifest does not reach. Check the
      # packaged file list, not just that the crate compiles.
      - name: Check packaged contents
        run: |
          cargo package --list -p wasm-smtp-component | grep -q '^wit/smtp.wit$'
          cargo package --list -p wasm-smtp-component | grep -q '^wit/deps/sockets.wit$'

      # The documented Worker examples are compiled for the target they
      # claim to run on, so the prose cannot rot silently.
      - name: Check examples for the Workers target
        run: cargo check --locked -p wasm-smtp-cloudflare --examples --target wasm32-unknown-unknown

      # Dependency versions in the documentation are constants that have to
      # match a release, which is exactly what rots between them. Twice the
      # owner found a stale one by hand before this check existed.
      - name: Check documentation versions
        run: ./tools/check-doc-versions.sh

      # The component repeats the WASI minor in nineteen places and the
      # lockfile decides it. They were two years apart until RFC 028,
      # because nothing compared them.
      - name: Check the declared WASI version
        run: ./tools/check-wasi-version.sh

      # The two checks above, checked. Each was shown failing once by hand;
      # these fixtures keep showing it, one minimal tree per branch.
      - name: Guard fixture tests
        run: ./tools/guard-tests/run.sh

      # Examples carry tests of their own (the contact-form header guard);
      # `cargo test --workspace` builds examples but does not run those.
      - name: Test examples
        run: cargo test --locked -p wasm-smtp-cloudflare --examples

      # The adapter's defects were all of the kind that only running it
      # finds, so the gate runs it: a real wasm32-wasip2 guest under
      # wasmtime against a scripted TLS SMTP responder on loopback, in both
      # implicit-TLS and STARTTLS modes. No external network.
      #
      # The wasmtime CLI is on the 36.0.x LTS line, the same line the component
      # harness links (tools/component-smoke/Cargo.toml), and for the same
      # reason: a test host should be trustworthy rather than current, and the
      # LTS line is the one that receives security backports. It replaced
      # 27.0.0, long out of support and invisible to cargo audit as a
      # downloaded binary (RFC 032 D4). The action prefixes the `v` itself.
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: "36.0.15"

      - name: On-target smoke test
        run: |
          cargo build --locked --target wasm32-wasip2 -p wasm-smtp-wasi --example smoke
          cargo run --locked -p wasm-smtp-smoke

      # The component shipped for three releases without ever being
      # instantiated. This runs it: wasmtime 36 as a library embeds the
      # built artifact, satisfies its WASI imports, and calls
      # `smtp-send.send` against the same scripted responder. No
      # wasmtime CLI — the host is a crate dependency of the harness.
      - name: Component host smoke test
        run: |
          cargo build --locked --target wasm32-wasip2 -p wasm-smtp-component
          cargo run --locked -p wasm-smtp-component-smoke

      # The book's Rust code, compiled (RFC 032 D2, A5). Chapters are included
      # only under the non-default `book` feature, so the workspace test run
      # neither compiles them nor enables `smtputf8` on the core; this command
      # does both, and `-p` keeps that feature to this crate's graph.
      - name: Book code blocks
        run: cargo test --locked -p wasm-smtp-book --features book

      # Rustdoc's own warnings, broken intra-doc links among them, fail the
      # gate, for the targets docs.rs builds (RFC 034 D5). RUSTDOCFLAGS is set
      # on these two steps only: `cargo test` reads it as well, for doctests.
      - name: Documentation (published host crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p wasm-smtp -p wasm-smtp-tokio -p wasm-smtp-cloudflare -p wasm-smtp-test -p wasm-smtp-component --features wasm-smtp/smtputf8,wasm-smtp/mail-builder,wasm-smtp/tracing

      - name: Documentation (wasm-smtp-wasi, wasm32-wasip2)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p wasm-smtp-wasi --target wasm32-wasip2

  # Non-blocking early warning about upcoming toolchain breakage.
  stable:
    name: stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install latest stable
        run: |
          rustup toolchain install stable --component clippy
          rustc +stable --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: stable

      - name: Test
        run: cargo +stable test --workspace

      - name: Clippy
        # --keep-going: without it Cargo stops scheduling after the first
        # crate fails, so one crate's lints hid the rest (RFC 033 D3).
        run: cargo +stable clippy --keep-going --workspace --all-targets -- -D warnings

  # Dependency advisories. Blocking: a vulnerability against anything in
  # the lockfile should turn the build red. cargo audit exits non-zero on
  # vulnerabilities; unsoundness and yanked-crate warnings show in the log
  # without failing, which is the level of noise a release gate can carry.
  audit:
    name: audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        # Exact version, so the scanner itself does not change between runs
        # unannounced. 0.22.2 is the current release (crates.io, 2026-06-05).
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        run: cargo audit
